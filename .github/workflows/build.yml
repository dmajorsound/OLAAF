name: build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this version tag, e.g. v0.8.2 (empty = just build)"
        required: false
        default: ""

jobs:
  macos:
    runs-on: macos-15-intel # arm64 runners are often out of capacity; this one still builds arm64 + x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Build (universal arm64 + x86_64)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          cmake --build build --config Release -j 4
      - name: Check binary
        run: |
          lipo -info build/src/ext/reaper_olaaf.dylib
          nm -gU build/src/ext/reaper_olaaf.dylib | grep ReaperPluginEntry
      - name: Package (.pkg)
        run: |
          mkdir -p payload ui
          cp build/src/ext/reaper_olaaf.dylib payload/
          chmod +x installer/mac/postinstall
          pkgbuild --root payload --install-location /tmp/olaaf-install \
            --scripts installer/mac --identifier com.dmajorsound.olaaf \
            --version 0.8.2 olaaf-component.pkg
          cp installer/mac_ui/welcome.html installer/mac_ui/logo.png installer/mac_ui/logo-dark.png ui/
          cp LICENSE ui/LICENSE.txt
          tiffutil -cathidpicheck installer/mac_ui/background.png installer/mac_ui/background@2x.png -out ui/background.tiff
          tiffutil -cathidpicheck installer/mac_ui/background-darkAqua.png installer/mac_ui/background-darkAqua@2x.png -out ui/background-darkAqua.tiff
          productbuild --distribution installer/mac_ui/distribution.xml --resources ui \
            --package-path . OLAAF-0.8.2-mac.pkg
          # uninstaller: an empty package whose script removes the extension
          pkgbuild --nopayload --scripts installer/mac_uninstall --identifier com.dmajorsound.olaaf.uninstall \
            --version 0.8.2 olaaf-uninstall-component.pkg
          cp installer/mac_ui/uninstall.html ui/
          productbuild --distribution installer/mac_ui/uninstall.xml --resources ui \
            --package-path . OLAAF-0.8.2-mac-uninstall.pkg
      - name: Disk image (.dmg) with the installer and the Privacy & Security helper
        run: |
          # macOS blocks the unsigned installer before it runs, so it can't help itself: next to it lies a
          # web location that opens System Settings > Privacy & Security, where "Open Anyway" lifts the block
          V=0.8.2
          mkdir -p dmg/.background
          cp OLAAF-$V-mac.pkg "dmg/Install OLAAF.pkg"
          cp OLAAF-$V-mac-uninstall.pkg "dmg/Uninstall OLAAF.pkg"
          cat > "dmg/Blocked? Open Privacy & Security.webloc" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>URL</key><string>x-apple.systempreferences:com.apple.preference.security?General</string></dict></plist>
          PLIST
          sed -i '' 's/^          //' "dmg/Blocked? Open Privacy & Security.webloc"
          tiffutil -cathidpicheck installer/mac_dmg/background.png installer/mac_dmg/background@2x.png -out dmg/.background/background.tiff
          hdiutil create -volname "OLAAF $V" -srcfolder dmg -ov -format UDRW -fs HFS+ rw.dmg
          DEV=$(hdiutil attach -readwrite -noverify -noautoopen rw.dmg | grep -E '^/dev/' | head -1 | awk '{print $1}')
          sleep 2
          # the window: the steps on the background, the three files in their places (best effort on the build machine)
          osascript <<OSA || echo "Finder layout skipped"
          tell application "Finder"
            tell disk "OLAAF $V"
              open
              set current view of container window to icon view
              set toolbar visible of container window to false
              set statusbar visible of container window to false
              set the bounds of container window to {200, 120, 840, 562}
              set opts to the icon view options of container window
              set arrangement of opts to not arranged
              set icon size of opts to 64
              set text size of opts to 12
              set background picture of opts to file ".background:background.tiff"
              set position of item "Install OLAAF.pkg" of container window to {150, 160}
              set position of item "Blocked? Open Privacy & Security.webloc" of container window to {330, 160}
              set position of item "Uninstall OLAAF.pkg" of container window to {530, 160}
              update without registering applications
              delay 2
              close
            end tell
          end tell
          OSA
          sync
          hdiutil detach "$DEV" || hdiutil detach -force "$DEV"
          hdiutil convert rw.dmg -format UDZO -imagekey zlib-level=9 -o OLAAF-$V-mac.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: OLAAF-mac
          path: |
            OLAAF-0.8.2-mac.dmg
            OLAAF-0.8.2-mac.pkg
            OLAAF-0.8.2-mac-uninstall.pkg
            build/src/ext/reaper_olaaf.dylib
            build/olaaf-cli

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (x64)
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release
      - name: Package (.exe)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\win\olaaf.iss
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\win\olaaf_uninstall.iss
      - uses: actions/upload-artifact@v4
        with:
          name: OLAAF-windows
          path: |
            installer/win/Output/OLAAF-0.8.2-win64.exe
            installer/win/Output/OLAAF-0.8.2-win64-uninstall.exe
            build/src/ext/Release/reaper_olaaf.dll
            build/Release/olaaf-cli.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
      - uses: actions/upload-artifact@v4
        with:
          name: OLAAF-linux
          path: |
            build/src/ext/reaper_olaaf.so
            build/olaaf-cli

  # "Run workflow" with a version (e.g. v0.8.2) publishes the installers as a GitHub release
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release != ''
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: |
          cat > notes.txt <<'NOTES'
          <p align="center">
          <picture>
          <source media="(prefers-color-scheme: dark)" srcset="https://raw.githubusercontent.com/dmajorsound/olAAF/main/installer/mac_ui/logo-dark.png">
          <img src="https://raw.githubusercontent.com/dmajorsound/olAAF/main/installer/mac_ui/logo.png" alt="dmajorsound" width="200">
          </picture>
          </p>

          <h2 align="center">OLAAF – AAF Import for Reaper</h2>
          <p align="center"><i>Do you wanna build a Reaper Session?</i></p>

          Free REAPER extension by dmajorsound. Imports AAF files from Pro Tools, DaVinci Resolve, Premiere, Avid and Nuendo with tracks, clips, fades, crossfades, clip gain and automation, sample-accurate.

          ### Download
          - **Mac** (Apple Silicon and Intel): `OLAAF-VERSION-mac.dmg` below (installer, uninstaller and a helper for the macOS block)
          - **Windows** (64-bit): `OLAAF-VERSION-win64.exe` below

          ### Install
          1. Quit REAPER.
          2. Open the installer and click through. It puts OLAAF into your REAPER UserPlugins folder.
          3. Start REAPER and open **Extensions → OLAAF: Import AAF…** (or drag an .aaf onto REAPER).

          > [!CAUTION]
          > **Mac: "OLAAF can't be opened" / "Apple could not verify…"**
          >
          > The installer is free and not signed by Apple, so macOS blocks it once. In the opened .dmg:
          > 1. Click **Done** in the warning.
          > 2. Double-click **Blocked? Open Privacy & Security**. System Settings opens: scroll down and click **Open Anyway** next to "Install OLAAF".
          > 3. Double-click **Install OLAAF** again and choose **Open**.

          > [!CAUTION]
          > **Windows: "Windows protected your PC" (SmartScreen)**
          >
          > The installer is not signed by Microsoft.
          > 1. Click **More info**.
          > 2. Click **Run anyway**.
          >
          > If your browser blocks the download, choose **Keep** in the download list.

          ### Uninstall
          - **Mac:** quit REAPER, open **Uninstall OLAAF** in the .dmg (or `OLAAF-VERSION-mac-uninstall.pkg`) and click through (same Open Anyway as above if macOS complains).
          - **Windows:** quit REAPER, open `OLAAF-VERSION-win64-uninstall.exe` and click through (same More info → Run anyway as above if SmartScreen complains). Or **Settings → Apps → Installed apps → OLAAF → Uninstall**.

          Your REAPER projects and imported audio stay untouched.

          ### What it does
          - Preview of the whole AAF in an arrange view: choose tracks, folders, names and colors
          - Remove, mute or move single events, even onto new tracks (automation goes along)
          - Combine .L / .R tracks to stereo, timecode offset, video and markers
          - Finds the media next to the AAF and in folders you point to; MXF, AIFF and embedded audio become Broadcast WAV

          V VERSION beta, developed with AI assistance · [dmajorsound.com](https://dmajorsound.com)
          NOTES
          sed -i "s/VERSION/${TAG#v}/g" notes.txt
          FILES="dl/OLAAF-mac/*.dmg dl/OLAAF-mac/*-uninstall.pkg dl/OLAAF-windows/installer/win/Output/*.exe"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # already published: replace the files and the notes
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber $FILES
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file notes.txt
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "OLAAF ${TAG#v} beta" \
              --notes-file notes.txt --prerelease $FILES
          fi
