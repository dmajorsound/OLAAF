name: build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this version tag, e.g. v0.5.0 (empty = just build)"
        required: false
        default: ""

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (universal arm64 + x86_64)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          cmake --build build --config Release -j 4
      - name: Check binary
        run: |
          lipo -info build/src/ext/reaper_olaaf.dylib
          nm -gU build/src/ext/reaper_olaaf.dylib | grep ReaperPluginEntry
      - name: Package (.pkg)
        run: |
          mkdir -p payload ui
          cp build/src/ext/reaper_olaaf.dylib payload/
          chmod +x installer/mac/postinstall
          pkgbuild --root payload --install-location /tmp/olaaf-install \
            --scripts installer/mac --identifier com.dmajorsound.olaaf \
            --version 0.5.0 olaaf-component.pkg
          cp installer/mac_ui/welcome.html installer/mac_ui/logo.png installer/mac_ui/logo-dark.png ui/
          cp LICENSE ui/LICENSE.txt
          tiffutil -cathidpicheck installer/mac_ui/background.png installer/mac_ui/background@2x.png -out ui/background.tiff
          tiffutil -cathidpicheck installer/mac_ui/background-darkAqua.png installer/mac_ui/background-darkAqua@2x.png -out ui/background-darkAqua.tiff
          productbuild --distribution installer/mac_ui/distribution.xml --resources ui \
            --package-path . olAAF-0.5.0-mac.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: olAAF-mac
          path: |
            olAAF-0.5.0-mac.pkg
            build/src/ext/reaper_olaaf.dylib
            build/olaaf-cli

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (x64)
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release
      - name: Package (.exe)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\win\olaaf.iss
      - uses: actions/upload-artifact@v4
        with:
          name: olAAF-windows
          path: |
            installer/win/Output/olAAF-0.5.0-win64.exe
            build/src/ext/Release/reaper_olaaf.dll
            build/Release/olaaf-cli.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
      - uses: actions/upload-artifact@v4
        with:
          name: olAAF-linux
          path: |
            build/src/ext/reaper_olaaf.so
            build/olaaf-cli

  # "Run workflow" with a version (e.g. v0.5.0) publishes the installers as a GitHub release
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release != ''
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: |
          cat > notes.txt <<'NOTES'
          **olAAF – AAF Import for Reaper.** Do you wanna build a Reaper Session?

          Free REAPER extension by dmajorsound. Imports AAF files from Pro Tools, DaVinci Resolve, Premiere, Avid and Nuendo with tracks, clips, fades, crossfades, clip gain and automation, sample-accurate.

          ### Download
          - **Mac** (Apple Silicon and Intel): `olAAF-…-mac.pkg`
          - **Windows** (64-bit): `olAAF-…-win64.exe`

          ### Install
          1. Quit REAPER.
          2. Open the installer and click through. It puts olAAF into your REAPER UserPlugins folder.
          3. Start REAPER and open **Extensions → olAAF: Import AAF…** (or drag an .aaf onto REAPER).

          Mac: if macOS says the installer is from an unidentified developer, right-click the .pkg, choose **Open**, then **Open** again.
          Windows: if SmartScreen warns, click **More info → Run anyway**.

          ### What it does
          - Preview of the whole AAF: choose tracks, folders and colors, remove, mute or move single events (automation goes along)
          - Combine .L / .R tracks to stereo, timecode offset, video and markers
          - Finds the media next to the AAF (and in folders you point to); MXF, AIFF and embedded audio become Broadcast WAV

          V VERSION beta, developed with AI assistance. dmajorsound.com
          NOTES
          sed -i "s/VERSION/${TAG#v}/" notes.txt
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "olAAF ${TAG#v} beta" \
            --notes-file notes.txt --prerelease \
            dl/olAAF-mac/*.pkg dl/olAAF-windows/installer/win/Output/*.exe
